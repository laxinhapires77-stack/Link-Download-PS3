name: Gerar PKG do PS3

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    container:
      image: hldtux/ps3dev:latest

    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Compilar EBOOT e empacotar PKG
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          make pkg

      - name: Salvar PKG pronto para download
        uses: actions/upload-artifact@v4
        with:
          name: LinkDownload-PS3-PKG
          path: "*.pkg"
          
